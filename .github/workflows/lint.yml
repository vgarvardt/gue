---
name: "Lint"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v9
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_EDITORCONFIG: true
          # - https://github.com/rhysd/actionlint/pull/694
          # - https://github.com/rhysd/actionlint/pull/732
          # VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          # go validator works pretty bad in super-linter, we'll use the original one
          # VALIDATE_GO: true
          VALIDATE_MARKDOWN: true
          VALIDATE_SPELL_CODESPELL: true
          # to see the problems right in the workflow output
          FIX_MARKDOWN_PRETTIER: true

      - name: Check linter fixes
        if: failure()
        run: |
          git --no-pager diff

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: "./go.mod"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Golang
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: >
            --config=./.github/linters/.golangci.yml
            --timeout=5m

      # using fork from https://github.com/super-linter/super-linter/issues/8189 because of the issues mentioned above
      - name: Run actionlint fork
        background: true
        uses: kjanat/actionlint@v1.17.0
